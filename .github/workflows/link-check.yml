name: Link Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Раз в неделю проверяем, не протухли ли ссылки
    - cron: "0 6 * * 1"

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,206,429 './**/*.md'
          fail: false
